# Fly.io config for the API.  Deploy from the repo root:
#   fly launch --config infra/fly.toml --dockerfile apps/api/Dockerfile
#   fly secrets set FERNET_KEY=... DATABASE_URL=... STRIPE_SECRET_KEY=... \
#     CLERK_JWKS_URL=... CORS_ORIGINS=https://www.exobod.ai WEB_ORIGIN=https://www.exobod.ai
# Postgres: `fly postgres create` then `fly postgres attach` (use the
# postgresql+asyncpg:// form of the URL it prints).

app = "exobod-api"
primary_region = "iad"

[build]
  dockerfile = "../apps/api/Dockerfile"

[env]
  LINK_KIND = "local"
  EXOBOD_DATA_DIR = "/data"

[[mounts]]
  source = "exobod_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false     # WS sessions — keep warm
  min_machines_running = 1

[checks.health]
  type = "http"
  port = 8000
  path = "/health"
  interval = "30s"
  timeout = "5s"
