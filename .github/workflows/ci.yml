name: CI

on:
  push:
    branches: [main, master, exobod-platform]
  pull_request:
    branches: [main, master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API + core deps
        run: pip install -r apps/api/requirements.txt
      - name: Core tests (20 — brain + constitution)
        run: cd packages/core && python -m pytest tests/ -q
      - name: API tests (REST + WS safety story)
        run: cd apps/api && python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @exobod/web exec tsc --noEmit
      - name: Build
        run: pnpm --filter @exobod/web build
